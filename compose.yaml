services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    image: mazdermind/replicate-sequences
    ports:
      - "8080:80"
    environment:
      - MODE=web
      - DB_HOST=db
      - DB_NAME=osm
      - DB_USER=osm
      - DB_PASSWORD=insecure-password
      - ABUSE_MAIL=fill-in-your-mail@example.com
      - URL_REPLICATION_PATH=https://s3.amazonaws.com/planet.openhistoricalmap.org/replication
  db:
    image: "mysql:8.3"
    environment:
      - MYSQL_DATABASE=osm
      - MYSQL_USER=osm
      - MYSQL_PASSWORD=insecure-password
      - MYSQL_ROOT_PASSWORD=1234
  
